# Analisi statica del client Coachly.
#
# Le regole di sviluppo vincolanti stanno in `.claude/rules/development.md`,
# l'architettura in `docs/development/`. Questo file è il primo livello di
# enforcement: vedi `docs/development/20-conventions-and-enforcement.md`.

include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint

  exclude:
    # Copia di lavoro non tracciata: non fa parte del progetto.
    - qual/**
    # Codice generato: non si modifica a mano.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    # Package separato, con il proprio pubspec e le proprie regole: analizzarlo
    # qui riporta le deprecazioni dell'API analyzer dentro il gate della app.
    - tool/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Rende visibili alle analisi statiche le violazioni delle dependency rules
    # di `docs/development/01-principles.md`: con import relativi non sono
    # rilevabili.
    - always_use_package_imports
    # `AppLogger` è l'unico canale di log previsto (18-observability.md).
    - avoid_print
    # L'ottimizzazione con il miglior rapporto costo/beneficio in Flutter.
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_const_declarations
    # Nessuna Future ignorata in silenzio: `unawaited()` esplicito.
    - unawaited_futures
    # Nessun BuildContext usato dopo un await senza `mounted`.
    - use_build_context_synchronously
    - sort_pub_dependencies
    - avoid_slow_async_io
