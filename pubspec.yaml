name: coachly
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ==================== STATE MANAGEMENT ====================
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # ==================== NAVIGATION ====================
  go_router: ^17.0.0

  # ==================== HTTP & NETWORK ====================
  http: ^1.6.0
  flutter_appauth: 11.0.0

  # ==================== UTILITIES BASE ====================

  # ==================== SERIALIZATION ====================
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ==================== UI DESIGN SYSTEM ====================
  flex_color_scheme: ^8.4.0           # Gestione temi avanzata Material 3
  shadcn_ui: ^0.39.14              # Componenti shadcn/ui moderni

  # ==================== ICONE MODERNE ====================
  ionicons: ^0.2.2                    # Icone Ionic (1300+ icone)

  # ==================== ANIMAZIONI ====================
  flutter_animate: ^4.5.2             # Animazioni fluide dichiarative
  flutter_ringtone_player: ^4.0.0+4
  # ==================== UI UTILITIES ====================
  gap: ^3.0.1                         # Spacing pulito e moderno
  shimmer: ^3.0.0                     # Skeleton loaders eleganti

  # ==================== EFFETTI GLASSMORPHISM ====================
  google_fonts: ^6.3.3
  collection: ^1.19.1

  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.3.1
  async: ^2.13.1
  uuid: ^4.6.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  #hive_generator: ^1.1.3

  # ==================== CODE GENERATION ====================
  build_runner: ^2.15.1
  json_serializable: ^6.7.1
  riverpod_generator: ^3.0.3
  freezed: ^3.2.3

flutter:
  uses-material-design: true

  # ==================== ASSETS ====================
  # Decommentare quando aggiungi assets
  assets:
    - assets/images/
    - assets/logos/
  #  - assets/animations/
  #  - assets/icons/


targets:
  $default:
    builders:
      freezed:
      json_serializable:
        options:
          explicit_to_json: true
