name: coachly
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  # Una responsabilità, una tecnologia (01-principles.md). L'ordine è
  # alfabetico perché lo verifica `sort_pub_dependencies`.
  connectivity_plus: ^7.3.1
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_appauth: 11.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.0.0
  go_router: ^17.0.0
  google_fonts: ^6.3.3
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  jwt_decoder: ^2.0.1
  riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  shadcn_ui: ^0.39.14
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  speech_to_text: ^7.4.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  coachly_lints:
    path: tool/coachly_lints
  custom_lint: ^0.8.0
  drift_dev: ^2.31.0
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
  generate: true

  # ==================== ASSETS ====================
  # Le cartelle NON sono ricorsive: ogni sottocartella va elencata a mano.
  # Struttura e naming: docs/development/16-media.md
  assets:
    - assets/brand/
    - assets/photos/
    - assets/illustrations/guides/
    - assets/illustrations/set_type/
  #  - assets/animations/
  #  - assets/icons/


targets:
  $default:
    builders:
      freezed:
      json_serializable:
        options:
          explicit_to_json: true
